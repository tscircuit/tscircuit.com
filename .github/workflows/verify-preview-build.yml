name: Verify Preview Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/server-draft-autosave-build-on-exit]

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Match the Vite production branch used when deployed to Vercel.
      VERCEL: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production assets
        run: bun run build
