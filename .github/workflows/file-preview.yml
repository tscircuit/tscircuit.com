name: File preview regression

on:
  pull_request:
    paths:
      - "src/components/ViewPackagePage/**"
      - "src/hooks/use-shiki-highlighter.ts"
      - "src/lib/code-preview.ts"
      - "src/lib/circuit-json-preview.ts"
      - "bun-tests/code-preview.test.ts"
      - "playwright-tests/large-package-file.spec.ts"
      - "playwright.config.ts"
      - "playwright-file-preview.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/file-preview.yml"
  push:
    branches: [main]
    paths:
      - "src/components/ViewPackagePage/**"
      - "src/hooks/use-shiki-highlighter.ts"
      - "src/lib/code-preview.ts"
      - "src/lib/circuit-json-preview.ts"
      - "bun-tests/code-preview.test.ts"
      - "playwright-tests/large-package-file.spec.ts"
      - "playwright.config.ts"
      - "playwright-file-preview.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/file-preview.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Build the test API
        run: bun run build:fake-api
      - name: Test large files and circuit previews
        run: bun x playwright test --config playwright-file-preview.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: file-preview-failures
          path: test-results
